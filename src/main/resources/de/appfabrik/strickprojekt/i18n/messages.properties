privacy.export=Collection export (including project status)\nYou can export all saved entries, selected color values and photos to a JSON file at a location you choose. The stored photo copies are included in full, with any metadata they still contain. The file is not encrypted. The app does not upload or send it. If you save it in a cloud or network folder, that provider may process it. Sharing and deleting exported copies is your responsibility.
photo.directoryNotSaved=Photo loaded. The folder could only be remembered for this session. Check write access to the app data folder.
privacy.photoDirectory=Photo selection folder\nThe app remembers the folder of your last selected photo locally so that the next file selection starts there, including after an app restart. Only the folder path is stored in the app data folder. It is not included in collection exports or sent anywhere.
