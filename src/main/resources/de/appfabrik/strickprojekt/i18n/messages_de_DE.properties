backup.import.title=Projektsammlung importieren
backup.import.busy=Sammlung wird geprüft und importiert …
backup.import.saved=Importiert: {0,number,integer}. Bereits vorhanden: {1,number,integer}.
backup.import.failed=Der Import konnte nicht abgeschlossen werden. Deine Sammlung ist unverändert. Bitte versuche es erneut.
backup.import.error.READ=Die Datei konnte nicht gelesen werden. Prüfe die Datei und ihre Zugriffsrechte.
backup.import.error.FORMAT=Diese Datei ist kein gültiger Sammlungsexport von Knitting Projects. Deine Sammlung ist unverändert.
backup.import.error.VERSION=Diese Exportversion wird noch nicht unterstützt. Deine Sammlung ist unverändert.
backup.import.error.LIMIT=Der Import überschreitet eine Grenze: 256 MiB je Datei, 10.000 Einträge, 1.048.576 Zeichen je Textfeld oder 10 MiB je Foto.
backup.import.error.PHOTO=Ein Foto im Export ist ungültig oder zu groß. Deine Sammlung ist unverändert.
privacy.import=Import der Sammlung (einschließlich Projektstatus)\nDie App liest den ausgewählten JSON-Export und ergänzt dessen Einträge, Farbwerte und Fotos in deiner lokalen Sammlung. Vorhandene Einträge bleiben erhalten. Bereits vorhandene identische Kopien werden übersprungen. Die Quelldatei wird weder verändert noch übertragen. Importierte Fotos behalten die im Export enthaltenen Metadaten.
photoError.OPTIMIZE=Das Foto konnte nicht optimiert werden. Bitte wähle ein anderes JPEG oder PNG. Dein bisheriges Foto bleibt erhalten.
privacy.photoOptimization=Optimierung neuer Fotos\nNeu ausgewählte oder ersetzte Fotos werden als Kopie mit höchstens 1600 Pixeln Kantenlänge gespeichert. Das Seitenverhältnis bleibt erhalten. Kleinere Bilder werden nicht vergrößert. Bilder ohne Transparenz werden als JPEG mit Qualität 85 %, transparente Bilder als PNG gespeichert. Die EXIF-Ausrichtung wird auf die Bildpunkte angewendet. Metadaten der Quelldatei wie Kamera- oder Standortangaben werden nicht übernommen. Die Originaldatei, bereits gespeicherte Fotos und aus JSON wiederhergestellte Fotos bleiben unverändert.
limit.ENTRIES=Die Sammlung darf höchstens 10.000 Einträge enthalten. Entferne einen Eintrag, bevor du weitere hinzufügst. Es wurden keine Änderungen gespeichert.
limit.TEXT=Ein Textfeld überschreitet 1.048.576 Zeichen. Kürze es vor dem Speichern oder Exportieren. Es wurden keine Änderungen gespeichert und kein Export erstellt.
limit.FILE_SIZE=Der Export überschreitet 256 MiB. Es wurde keine Exportdatei erstellt. Schließe die App und kopiere strickprojekt.db, um die gesamte Sammlung zu sichern.
