backup.export.title=Projektsammlung exportieren
backup.export.busy=Sammlung mit Fotos wird exportiert …
backup.export.saved={0,number,integer} Einträge nach {1} exportiert
backup.export.exists=Diese Datei existiert bereits. Wähle einen neuen Dateinamen für den Export.
backup.export.failed=Die Sammlung konnte nicht exportiert werden. Prüfe Zielordner, freien Speicher und gespeicherte Fotos und versuche es erneut.
privacy.export=Export der Sammlung (einschließlich Projektstatus)\nDu kannst alle gespeicherten Einträge, ausgewählten Farbwerte und Fotos als JSON-Datei an einem selbst gewählten Ort exportieren. Die gespeicherten Fotokopien werden vollständig einschließlich darin noch vorhandener Metadaten mitgegeben. Die Datei ist nicht verschlüsselt. Die App lädt sie nicht hoch und versendet sie nicht. Bei einem Cloud- oder Netzwerkordner kann der jeweilige Anbieter die Datei verarbeiten. Weitergabe und Löschung exportierter Kopien liegen bei dir.
photo.directoryNotSaved=Foto geladen. Der Ordner konnte nur für diese Sitzung gemerkt werden. Prüfe die Schreibrechte im App-Datenordner.
privacy.photoDirectory=Ordner der Fotoauswahl\nDie App merkt sich den Ordner des zuletzt ausgewählten Fotos lokal, damit die nächste Dateiauswahl dort beginnt, auch nach einem App-Neustart. Gespeichert wird nur der Ordnerpfad im App-Datenordner. Er wird weder in Sammlungsexporte aufgenommen noch übertragen.
